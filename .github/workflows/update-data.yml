
name: Update Ontario Energy Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update energy data
        run: |
          python src/update_data.py

      - name: Check for database changes
        id: changes
        run: |
          if git diff --quiet -- data/processed/energy.db; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Database changes detected."
          fi

      - name: Commit updated database
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/energy.db

          git commit -m "Update IESO energy data"

          git push

      - name: No changes to commit
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Energy data is already up to date."
